name: Sync Khung Quan tri Du lieu QG (hang thang)

on:
  schedule:
    # 02:00 UTC ngay 1 hang thang (~09:00 gio Viet Nam)
    - cron: "0 2 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dong bo noi dung tu trang nguon
        run: node scripts/sync-khung-quan-tri.js

      - name: Commit neu co thay doi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/phap-luat/khung-quan-tri-dl
          if git diff --cached --quiet; then
            echo "Khong co thay doi noi dung tu trang nguon, bo qua commit."
          else
            git commit -m "Dong bo dinh ky: Khung Kien truc & Quan tri Du lieu QG tu kientrucdulieu-app"
            git push
          fi
